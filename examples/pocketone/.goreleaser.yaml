# PocketOne's release config (the repo root's .goreleaser.yaml is upstream's, for plain examples/base).
# Cut a release with examples/pocketone/release.sh (it runs goreleaser only on a commit that passed
# .github/workflows/release-check.yml):
#
#   examples/pocketone/release.sh --check
#   examples/pocketone/release.sh vX.Y.Z
#
version: 2

project_name: pocketone

dist: .builds

before:
  hooks:
    - go mod tidy
    - go -C examples/pocketone mod tidy

builds:
  - id: build_noncgo
    # the standard PocketOne binary: examples/base + the default PocketOne extensions, in its own module
    dir: examples/pocketone
    main: .
    binary: pocketone
    ldflags:
      - -s -w -X ganigeorgiev.com/pocketbase/pocketbase.Version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
      - s390x
      - ppc64le
    goarm:
      - 7
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: s390x
      - goos: windows
        goarch: ppc64le
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: s390x
      - goos: darwin
        goarch: ppc64le

release:
  draft: true
  # a tag with a prerelease part (v0.1.0-alpha.1) is published as a GitHub prerelease, so it's never "Latest"
  prerelease: auto
  name_template: 'PocketOne {{ .Tag }}'
  # publishing the release starts its announcement in Discussions, with these notes
  discussion_category_name: Announcements
  # every release's notes start with its blog post (site/pb_pages/(main)/blog/pocketone-vX-Y-Z.md) and how to install
  # or upgrade; the version's own notes (from CHANGELOG.md) follow
  header: |
    **[Read the announcement on the blog](https://pocketone.dev/blog/pocketone-{{ replace .Tag "." "-" }})**

    ## Install or upgrade

    **New install on macOS or Linux:**

    ```bash
    brew install pocketonehq/tap/pocketone
    ```

    That's Homebrew; the formula comes from [pocketonehq/homebrew-tap](https://github.com/pocketonehq/homebrew-tap).

    **New install on Windows:**

    ```powershell
    scoop bucket add pocketonehq https://github.com/pocketonehq/scoop-bucket
    scoop install pocketone
    ```

    That's [Scoop](https://scoop.sh); the manifest comes from [pocketonehq/scoop-bucket](https://github.com/pocketonehq/scoop-bucket). To install without Scoop, see [Windows without Scoop](https://pocketone.dev/docs/guides/advanced-installation#windows-without-scoop).

    **Without Homebrew, on macOS or Linux:**

    ```bash
    curl -fsSL https://pocketone.dev/install.sh | sh
    ```

    On Linux it installs the `.deb`, `.rpm` or `.apk` package below for your system, which adds a systemd service ([Run PocketOne on a Linux server](https://pocketone.dev/docs/guides/linux-server) covers setting it up); on macOS it puts `pocketone` in `/usr/local/bin`.

    **Upgrade:**

    ```bash
    brew upgrade pocketone
    ```

    On Windows with Scoop, `scoop update pocketone`. If you used the install script (or a Linux package), run the script again. Otherwise, run `pocketone upgrade` (it keeps the old executable as `pocketone-<version>`, `pocketone-<version>.exe` on Windows) or download the zip below. Check the **Upgrading** section below, if this release has one, before you upgrade.

    ## What's in this release

# the Homebrew formula in pocketonehq/homebrew-tap, updated on every release, prereleases included. brews is deprecated in favor of
# homebrew_casks, but casks are macOS-only and quarantine unsigned binaries; the formula works on macOS and Linux.
brews:
  - name: pocketone
    ids: [archive_noncgo]
    repository:
      owner: pocketonehq
      name: homebrew-tap
    directory: Formula
    homepage: https://github.com/pocketonehq/pocketone
    description: PocketOne, a community fork of PocketBase with extensions (pages, pocker and more)
    license: MIT
    commit_author:
      name: PocketOne HQ
      email: noreply@pocketone.dev
    install: |
      bin.install "pocketone"
    test: |
      system "#{bin}/pocketone", "--version"

# the Scoop manifest in pocketonehq/scoop-bucket (Windows), updated on every release, prereleases included, the way the
# formula above is for Homebrew
scoops:
  - name: pocketone
    ids: [archive_noncgo]
    repository:
      owner: pocketonehq
      name: scoop-bucket
    directory: bucket
    homepage: https://github.com/pocketonehq/pocketone
    description: PocketOne, a community fork of PocketBase with extensions (pages, pocker and more)
    license: MIT
    commit_author:
      name: PocketOne HQ
      email: noreply@pocketone.dev

archives:
  - id: archive_noncgo
    ids: [build_noncgo]
    formats: [zip]
    files:
      - LICENSE.md
      - CHANGELOG.md
      - CHANGELOG.pocketbase.md

# Linux packages: the binary in /usr/bin, a systemd unit (deb, rpm) that runs as the pocketone user with its data in
# /var/lib/pocketone, and its config in /etc/pocketone (kept on upgrade). Named like the zips
# (pocketone_<version>_linux_<arch>.deb), which is what site/pb_pages/install.sh downloads.
nfpms:
  - id: packages
    ids: [build_noncgo]
    package_name: pocketone
    file_name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}'
    formats: [deb, rpm, apk]
    vendor: PocketOne HQ
    maintainer: PocketOne HQ <noreply@pocketone.dev>
    homepage: https://pocketone.dev
    description: PocketOne, a community fork of PocketBase with extensions (pages, pocker and more)
    license: MIT
    bindir: /usr/bin
    contents:
      - src: examples/pocketone/packaging/pocketone.service
        dst: /usr/lib/systemd/system/pocketone.service
        packager: deb
      - src: examples/pocketone/packaging/pocketone.service
        dst: /usr/lib/systemd/system/pocketone.service
        packager: rpm
      - src: examples/pocketone/packaging/pocketone.yaml
        dst: /etc/pocketone/pocketone.yaml
        type: config|noreplace
      - src: examples/pocketone/packaging/service.env
        dst: /etc/pocketone/service.env
        type: config|noreplace
    scripts:
      postinstall: examples/pocketone/packaging/postinstall.sh
      preremove: examples/pocketone/packaging/preremove.sh
      postremove: examples/pocketone/packaging/postremove.sh

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

# GitHub renders every newline in release notes as a line break: never hard-wrap the header above or the notes file.
# Release notes come from CHANGELOG.md (see its top for the policy): stamp it with
#   go run ./.github/extensions release vX.Y.Z   (then commit and push)
# and release.sh passes examples/pocketone/release-notes.sh's output as --release-notes
# (--release-notes skips the generated changelog, which would list PocketBase's whole upstream history). Don't set
# changelog.disable: it drops the --release-notes file too. The header above is prepended to the notes.
