# PocketOne's release config (the repo root's .goreleaser.yaml is upstream's, for plain examples/base).
# Run from the repo root:
#
#   examples/pocketone/release-notes.sh vX.Y.Z > /tmp/notes.md
#   goreleaser release --config examples/pocketone/.goreleaser.yaml --release-notes /tmp/notes.md
#
version: 2

project_name: pocketone

dist: .builds

before:
  hooks:
    - go mod tidy
    - go -C examples/pocketone mod tidy

builds:
  - id: build_noncgo
    # the standard PocketOne binary: examples/base + the default PocketOne extensions, in its own module
    dir: examples/pocketone
    main: .
    binary: pocketone
    ldflags:
      - -s -w -X ganigeorgiev.com/pocketbase/pocketbase.Version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
      - s390x
      - ppc64le
    goarm:
      - 7
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: s390x
      - goos: windows
        goarch: ppc64le
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: s390x
      - goos: darwin
        goarch: ppc64le

release:
  draft: true
  # a tag with a prerelease part (v0.1.0-alpha.1) is published as a GitHub prerelease, so it's never "Latest"
  prerelease: auto
  name_template: 'PocketOne {{ .Tag }}'
  # every release's notes start with how to install or upgrade; the version's own notes (from docs/CHANGELOG.md) follow
  header: |
    ## Install or upgrade

    **New install:**

    ```bash
    brew install pockethost/tap/pocketone
    ```

    Homebrew on macOS or Linux; the formula comes from [pockethost/homebrew-tap](https://github.com/pockethost/homebrew-tap). Or download the zip for your platform below and run `./pocketone serve`.

    **Upgrade:**

    ```bash
    brew upgrade pocketone
    ```

    Or, if you didn't install with Homebrew, run `pocketone upgrade` (it keeps the old executable as `pocketone-<version>`) or download the zip below. Check the version's **Upgrading** section below, if it has one, before you upgrade.

# the Homebrew formula in pockethost/homebrew-tap, updated on every release, prereleases included. brews is deprecated in favor of
# homebrew_casks, but casks are macOS-only and quarantine unsigned binaries; the formula works on macOS and Linux.
brews:
  - name: pocketone
    ids: [archive_noncgo]
    repository:
      owner: pockethost
      name: homebrew-tap
    directory: Formula
    homepage: https://github.com/pockethost/pocketone
    description: PocketOne, a community fork of PocketBase with extensions (pages, pocker and more)
    license: MIT
    commit_author:
      name: PocketHost
      email: noreply@pockethost.io
    install: |
      bin.install "pocketone"
    test: |
      system "#{bin}/pocketone", "--version"

archives:
  - id: archive_noncgo
    ids: [build_noncgo]
    formats: [zip]
    files:
      - LICENSE.md
      - CHANGELOG.md
      - docs/CHANGELOG.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

# GitHub renders every newline in release notes as a line break: never hard-wrap the header above or the notes file.
# Release notes come from docs/CHANGELOG.md (see its top for the policy): always run
#   examples/pocketone/release-notes.sh vX.Y.Z > /tmp/notes.md
#   goreleaser release --config examples/pocketone/.goreleaser.yaml --release-notes /tmp/notes.md
# (--release-notes skips the generated changelog, which would list PocketBase's whole upstream history). Don't set
# changelog.disable: it drops the --release-notes file too. The header above is prepended to the notes.
