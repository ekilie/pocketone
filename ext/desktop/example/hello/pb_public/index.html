<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { max-width: 36rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; }
      form { display: flex; gap: 0.5rem; margin: 1.5rem 0; }
      input { flex: 1; padding: 0.5rem; font: inherit; }
      button { padding: 0.5rem 1rem; font: inherit; }
      li { padding: 0.25rem 0; }
      small { opacity: 0.6; }
    </style>
  </head>
  <body>
    <h1>Hello</h1>
    <p id="message">…</p>
    <form id="add">
      <input id="text" placeholder="Add a greeting" maxlength="200" required />
      <button>Add</button>
    </form>
    <ul id="list"></ul>
    <p><small>Served by <span id="server"></span></small></p>
    <script>
      async function load() {
        const res = await fetch("/api/hello")
        const data = await res.json()
        document.getElementById("message").textContent = data.message
        const list = document.getElementById("list")
        list.replaceChildren(...data.greetings.map((t) => Object.assign(document.createElement("li"), { textContent: t })))
        document.getElementById("server").textContent = res.headers.get("X-Powered-By") || location.origin
      }
      document.getElementById("add").addEventListener("submit", async (e) => {
        e.preventDefault()
        const input = document.getElementById("text")
        await fetch("/api/collections/greetings/records", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: input.value }),
        })
        input.value = ""
        load()
      })
      load()
    </script>
  </body>
</html>
