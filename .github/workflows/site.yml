# pocketone.dev builds each plugin's page from ext/<name>/docs/ and the pocketone binary's config sections
# (site/sync). Fail when a page is out of date or a plugin folder isn't listed in site/plugins.json.
name: site

on:
  push:
    branches: [main]
    paths: ['ext/**', 'docs/**', 'site/**', 'examples/pocketone/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['ext/**', 'docs/**', 'site/**', 'examples/pocketone/**', '.github/workflows/site.yml']

jobs:
  sync-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: site/sync/go.mod
          cache-dependency-path: "**/go.sum"
      - name: Site is in sync with ext/ and docs/
        working-directory: site/sync
        run: go run . --check
