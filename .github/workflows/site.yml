# pocketone.dev builds each extension's page from ext/<name>/README.md and the pocketone binary's config sections
# (site/sync), plus the search index, llms.txt and the Agent Skills' reference files; the contract READMEs' Extensions
# indexes are generated from every extension's Contracts().
#
# Pull requests run the same regenerate script main runs after the merge, on the pull request merged into main, and
# list the generated files main will commit; they never commit one themselves, so an extension author's pull request
# touches only their extension's folder.
# On main, `regenerate` runs .github/regenerate.sh and commits what changed as github-actions[bot] (only generated
# files, never core; local commits already include them through .github/hooks/pre-commit, so this only finds work after
# an outside pull request merges), then deploys site/pb_pages to the `pocketone` instance on PocketHost (pocketone.dev).
# Extension sites (ext/<name>/site, such as PocketPages' docs, formerly pocketpages.dev) are part of it.
# The deploy (pocketone deploy, to site/.pocketbase/remotes.json's remote) needs the POCKETHOST_TOKEN repository secret
# (a PocketHost API token that can deploy to that instance); without it the job says so and skips.
name: site

on:
  push:
    branches: [main]
    paths: ['ext/**', 'docs/**', 'site/**', 'examples/pocketone/**', 'agent/**', '.github/extensions/**', '.github/regenerate.sh', '.github/workflows/site.yml']
  pull_request:
    paths: ['ext/**', 'docs/**', 'site/**', 'examples/pocketone/**', 'agent/**', '.github/extensions/**', '.github/regenerate.sh', '.github/workflows/site.yml']

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: site/sync/go.mod
          cache-dependency-path: "**/go.sum"
      - name: site/sync tests
        working-directory: site/sync
        run: go test .
      # The same script main runs after the merge, on this pull request merged into main (what actions/checkout
      # checks out), so a regenerate that would fail on main fails here first. Only main's push isn't rehearsed.
      - name: Regenerate as main will (generated files are committed by main, not here)
        run: .github/regenerate.sh
      - name: What main will commit after the merge
        run: |
          set -euo pipefail
          changed=$(git status --porcelain | sed 's/^...//')
          {
            if [ -z "$changed" ]; then
              echo "Merging this changes no generated file."
            else
              echo "After the merge, main's regenerate job will commit these generated files:"
              echo
              echo "$changed" | sed 's/^/- `/; s/$/`/'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  regenerate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: site-regenerate
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-go@v6
        with:
          go-version-file: site/sync/go.mod
          cache-dependency-path: "**/go.sum"
      - name: site/sync tests
        working-directory: site/sync
        run: go test .
      - name: Regenerate and commit what changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # main may move while this runs: start again from the new main, up to 3 times
          for attempt in 1 2 3; do
            .github/regenerate.sh
            if [ -z "$(git status --porcelain)" ]; then
              echo "nothing to regenerate"
              break
            fi
            git add -A
            git commit -q -m "Regenerate the site and contract indexes" -m "Generated by .github/regenerate.sh from $(git rev-parse --short HEAD)."
            if git push origin HEAD:main; then
              break
            fi
            [ "$attempt" = 3 ] && { echo "::error::main kept moving; regenerate on the next push"; exit 1; }
            echo "main moved; trying again ($attempt)"
            git fetch -q origin main
            git reset -q --hard origin/main
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: regenerate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pocketone-dev-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.regenerate.outputs.sha }}
      # pocketone deploy, from the newest PocketOne release (the npm pockethost CLI no longer signs in to PocketHost)
      - name: Install pocketone (newest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list -R pocketonehq/pocketone --limit 1 --json tagName -q '.[0].tagName')
          echo "pocketone $tag"
          gh release download "$tag" -R pocketonehq/pocketone -p "pocketone_${tag#v}_linux_amd64.zip" -O "$RUNNER_TEMP/pocketone.zip"
          unzip -q "$RUNNER_TEMP/pocketone.zip" pocketone -d "$RUNNER_TEMP/pocketone"
          echo "$RUNNER_TEMP/pocketone" >> "$GITHUB_PATH"
      # Deploys site/pb_pages to the default remote in site/.pocketbase/remotes.json (https://pocketone.dev).
      - name: Deploy site/pb_pages to pocketone.dev
        working-directory: site
        env:
          P1_TOKEN: ${{ secrets.POCKETHOST_TOKEN }}
        run: |
          if [ -z "$P1_TOKEN" ]; then
            echo "::notice::POCKETHOST_TOKEN is not set; skipping the pocketone.dev deploy"
            exit 0
          fi
          pocketone deploy --no-node-modules
