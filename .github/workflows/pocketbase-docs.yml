# PocketBase's own docs as Markdown (agent/skills/pocketone/reference/pocketbase), from PocketOne's mirror of the
# PocketBase site (github.com/pocketonehq/pocketbase-site, refreshed daily at 09:23 UTC). Once a day, after the mirror,
# this moves .github/pocketbase-docs/PIN to the mirror's master, builds the site and converts its docs pages
# (.github/pocketbase-docs), and commits what changed to main as github-actions[bot]. Nothing to commit when the site
# didn't change. Run it by hand from the Actions tab (workflow_dispatch).
name: pocketbase-docs

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pocketbase-docs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-go@v6
        with:
          go-version-file: .github/pocketbase-docs/go.mod
          cache-dependency-path: .github/pocketbase-docs/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the docs at the mirror's master and commit what changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # main may move while this runs: start again from the new main, up to 3 times
          for attempt in 1 2 3; do
            (cd .github/pocketbase-docs && go run . --update)
            if [ -z "$(git status --porcelain -- .github/pocketbase-docs/PIN agent/skills/pocketone/reference/pocketbase)" ]; then
              echo "nothing changed"
              break
            fi
            git add -A -- .github/pocketbase-docs/PIN agent/skills/pocketone/reference/pocketbase
            git commit -q -m "PocketBase docs: $(head -c 8 .github/pocketbase-docs/PIN)" \
              -m "Generated by .github/pocketbase-docs from pocketonehq/pocketbase-site at $(cat .github/pocketbase-docs/PIN)."
            if git push origin HEAD:main; then
              break
            fi
            [ "$attempt" = 3 ] && { echo "::error::main kept moving; try again later"; exit 1; }
            echo "main moved; trying again ($attempt)"
            git fetch -q origin main
            git reset -q --hard origin/main
          done
