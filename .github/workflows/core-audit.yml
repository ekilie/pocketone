# Every commit that changes PocketBase core (anything outside ext/, site/, examples/pocketone/, docs/, README.md, CONTRIBUTING.md, AGENTS.md, CLAUDE.md,
# .github/, .claude/, .claude-plugin/, agent/) must carry a "Core-Audit:" trailer recording its independent audit. See AGENTS.md.
name: core-audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  trailer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Core commits carry a Core-Audit trailer
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            echo "no previous commit to compare with; skipping"; exit 0
          fi
          missing=0
          # Upstream's own commits arrive through a merge whose trailer is "Core-Audit: upstream-merge vX.Y.Z"; that
          # merge vouches for them, so skip everything reachable only from its upstream (second) parent.
          skip=()
          for m in $(git rev-list --merges "$BEFORE..$AFTER"); do
            if git log -1 --format='%(trailers:key=Core-Audit,valueonly)' "$m" | grep -q '^upstream-merge '; then
              echo "upstream merge $(git log -1 --format='%h %s' "$m")"
              skip+=("^$m^2")
            fi
          done
          for c in $(git rev-list --no-merges "$BEFORE..$AFTER" "${skip[@]}"); do
            core=$(.github/core-audit/core-diff.sh --files "$c^" "$c" || true)
            [ -z "$core" ] && continue
            trailer=$(git log -1 --format='%(trailers:key=Core-Audit,valueonly)' "$c" | sed '/^$/d')
            if [ -z "$trailer" ]; then
              echo "::error::$(git log -1 --format='%h %s' "$c") changes core without a Core-Audit trailer:"
              echo "$core" | sed 's/^/  /'
              missing=1
            else
              echo "ok $(git log -1 --format='%h' "$c"): Core-Audit: $trailer"
            fi
          done
          exit $missing
